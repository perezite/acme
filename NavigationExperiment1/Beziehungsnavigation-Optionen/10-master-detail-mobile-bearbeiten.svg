<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 1390" role="img" aria-labelledby="title desc" fill="#203453">
<title id="title">Master-Detail auf Mobile mit editierbaren Feldern</title>
<desc id="desc">Ein Smartphone zeigt editierbare Felder des ausgewählten Projekt-Masters und des Kunden im Target. Die Beziehungstabs und die Navigation zur nächsten Ebene bleiben zugänglich.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafd"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c91f1"/><stop offset="1" stop-color="#3474d9"/></linearGradient>
  <filter id="shadow" x="-15%" y="-10%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#18345b" flood-opacity=".12"/></filter>
  <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.muted{fill:#8290a3}.blueText{fill:#3479df}.small{font-size:13px}.tiny{font-size:11px}.line{stroke:#e7ecf2;stroke-width:1}.input{fill:#fff;stroke:#dce4ee;stroke-width:1.2}</style>
</defs>
<rect width="660" height="1390" fill="url(#canvas)"/>
<text x="40" y="48" class="muted small">Acme · Responsive Mockup</text>
<text x="40" y="82" font-size="24" font-weight="700">Master-Detail · Mobile-Bearbeitung</text>
<text x="40" y="108" class="muted small">Beide Datensätze bearbeiten, Beziehungen behalten und weiter navigieren</text>

<!-- Smartphone -->
<rect x="105" y="136" width="450" height="1210" rx="38" fill="#182435" filter="url(#shadow)"/>
<rect x="114" y="145" width="432" height="1192" rx="30" fill="#fff"/>
<rect x="270" y="152" width="120" height="16" rx="8" fill="#182435"/>
<text x="139" y="188" class="tiny" font-weight="700">9:41</text><text x="521" y="188" text-anchor="end" class="tiny" font-weight="700">●●●  ▰</text>
<path d="M114 204H546" stroke="#edf0f4"/>
<text x="139" y="237" class="blueText small" font-weight="600">‹ Zurück zu Projekte</text>
<text x="139" y="274" font-size="21" font-weight="700">Datensatz bearbeiten</text>

<!-- Master fields -->
<rect x="139" y="294" width="382" height="28" rx="7" fill="#f3f7fc"/>
<rect x="149" y="301" width="6" height="14" rx="3" fill="#4c91f1"/>
<text x="164" y="313" class="blueText tiny" font-weight="700" letter-spacing=".5">MASTER · PROJEKT</text>
<text x="139" y="347" font-size="16" font-weight="700">Website-Relaunch</text>
<text x="521" y="347" text-anchor="end" class="blueText tiny" font-weight="600">Änderungen offen</text>

<text x="139" y="372" class="muted tiny" font-weight="600">Projektname</text>
<rect x="139" y="380" width="382" height="42" rx="7" class="input"/>
<text x="152" y="406" font-size="13">Website-Relaunch</text>

<text x="139" y="447" class="muted tiny" font-weight="600">Status</text>
<rect x="139" y="455" width="382" height="42" rx="7" class="input"/>
<text x="152" y="481" font-size="13">In Arbeit</text><text x="505" y="481" text-anchor="end" class="muted small">⌄</text>

<text x="139" y="522" class="muted tiny" font-weight="600">Budget</text>
<rect x="139" y="530" width="382" height="42" rx="7" class="input"/>
<text x="152" y="556" font-size="13">48.000 CHF</text>

<!-- Relationship tabs -->
<text x="139" y="604" font-size="14" font-weight="700">Verknüpfte Datensätze</text>
<rect x="139" y="617" width="97" height="37" rx="8" fill="#edf4fd"/>
<text x="187.5" y="641" text-anchor="middle" class="blueText small" font-weight="700">Kunden · 1</text>
<text x="280" y="641" text-anchor="middle" class="muted small" font-weight="600">Aufgaben · 3</text>
<text x="407" y="641" text-anchor="middle" class="muted small" font-weight="600">Zeit · 2</text>
<path d="M139 661H521" class="line"/>

<!-- Target fields -->
<rect x="139" y="676" width="382" height="28" rx="7" fill="#f7f8fa"/>
<rect x="149" y="683" width="6" height="14" rx="3" fill="#aab5c4"/>
<text x="164" y="695" class="muted tiny" font-weight="700" letter-spacing=".5">TARGET · KUNDE</text>
<text x="139" y="731" font-size="16" font-weight="700">Nordlicht Studio</text>
<text x="521" y="731" text-anchor="end" class="muted tiny">Kunde · KD-021</text>

<text x="139" y="756" class="muted tiny" font-weight="600">Kundenname</text>
<rect x="139" y="764" width="382" height="42" rx="7" class="input"/>
<text x="152" y="790" font-size="13">Nordlicht Studio</text>

<text x="139" y="831" class="muted tiny" font-weight="600">Branche</text>
<rect x="139" y="839" width="382" height="42" rx="7" class="input"/>
<text x="152" y="865" font-size="13">Design &amp; Medien</text>

<text x="139" y="906" class="muted tiny" font-weight="600">Kontaktperson</text>
<rect x="139" y="914" width="382" height="42" rx="7" class="input"/>
<text x="152" y="940" font-size="13">Mia Lehmann</text>

<rect x="139" y="975" width="382" height="42" rx="8" fill="#fff" stroke="#dce4ee"/>
<text x="330" y="1001" text-anchor="middle" class="blueText small" font-weight="600">Nordlicht Studio als Master öffnen →</text>

<!-- Sticky save area -->
<rect x="114" y="1040" width="432" height="297" rx="0" fill="#fff"/>
<path d="M114 1040H546" stroke="#e7ecf2"/>
<rect x="139" y="1060" width="382" height="38" rx="7" fill="#f6f8fb"/>
<circle cx="155" cy="1079" r="4" fill="#e5a43b"/>
<text x="168" y="1083" class="muted tiny">Änderungen in 2 Datensätzen</text>
<rect x="139" y="1110" width="382" height="48" rx="8" fill="url(#blue)"/>
<text x="330" y="1140" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Änderungen speichern</text>
<text x="330" y="1185" text-anchor="middle" class="muted tiny">Master und Target werden separat validiert.</text>
<rect x="258" y="1318" width="144" height="5" rx="2.5" fill="#1d2734"/>
</svg>
