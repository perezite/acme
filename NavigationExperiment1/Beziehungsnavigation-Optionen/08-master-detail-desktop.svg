<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc" fill="#203453">
<title id="title">Master-Detail-Rohdatenansicht auf Desktop</title>
<desc id="desc">Desktop-Layout mit Master-Projekttabelle oben und tabbasierter Target-Tabelle darunter.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafd"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c91f1"/><stop offset="1" stop-color="#3474d9"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#18345b" flood-opacity=".055"/></filter>
  <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.muted{fill:#8290a3}.blueText{fill:#3479df}.small{font-size:13px}.tiny{font-size:11px}.line{stroke:#e7ecf2;stroke-width:1}.card{fill:#fff;stroke:#e0e7ef;stroke-width:1.4}</style>
</defs>
<rect width="1440" height="1100" fill="url(#bg)"/>
<rect width="1440" height="78" fill="#fff"/><path d="M0 77.5H1440" stroke="#e5ebf2"/>
<rect x="76" y="18" width="42" height="42" rx="13" fill="url(#blue)"/><text x="97" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">A</text><text x="132" y="45" font-size="21" font-weight="700">Acme</text>
<rect x="520" y="18" width="400" height="42" rx="10" fill="#f5f7fa" stroke="#e4e9f0"/><circle cx="543" cy="39" r="7" fill="none" stroke="#94a1b2" stroke-width="2"/><path d="m548 44 6 6" stroke="#94a1b2" stroke-width="2"/><text x="566" y="44" class="muted" font-size="14">Suchen…</text>
<circle cx="1321" cy="39" r="18" fill="#eef4fc"/><text x="1321" y="44" text-anchor="middle" font-size="12" font-weight="700" class="blueText">ML</text><text x="1350" y="44" class="muted" font-size="13">Mia Lehmann</text>
<text x="78" y="119" class="muted small">Arbeitsbereiche  ›  Daten</text><text x="78" y="165" font-size="29" font-weight="700">Projekte</text><text x="78" y="192" class="muted" font-size="15">Wähle ein Projekt; zugehörige Datensätze erscheinen in der Target-Tabelle.</text>

<!-- Master -->
<rect x="78" y="220" width="1284" height="365" rx="12" class="card" filter="url(#shadow)"/>
<rect x="99" y="239" width="25" height="22" rx="6" fill="#edf4fd"/><text x="111.5" y="254" text-anchor="middle" class="blueText tiny" font-weight="700">1</text><text x="136" y="255" font-size="16" font-weight="700">Master-Tabelle</text><text x="267" y="255" class="muted small">4 Projekte</text>
<rect x="930" y="234" width="235" height="34" rx="7" fill="#fff" stroke="#e1e7ef"/><circle cx="948" cy="251" r="5" fill="none" stroke="#9aa7b7" stroke-width="1.5"/><path d="m952 255 4 4" stroke="#9aa7b7" stroke-width="1.5"/><text x="964" y="256" class="muted small">Projekte suchen…</text><rect x="1177" y="234" width="163" height="34" rx="7" fill="#fff" stroke="#dce4ee"/><text x="1258" y="256" text-anchor="middle" class="blueText small" font-weight="650">＋ Neues Projekt</text>
<rect x="99" y="284" width="1242" height="38" rx="4" fill="#f5f7fa"/><text x="116" y="308" class="muted tiny" font-weight="650">PROJEKT</text><text x="392" y="308" class="muted tiny" font-weight="650">KUNDE</text><text x="660" y="308" class="muted tiny" font-weight="650">VERANTWORTLICH</text><text x="892" y="308" class="muted tiny" font-weight="650">STATUS</text><text x="1087" y="308" class="muted tiny" font-weight="650">FORTSCHRITT</text><text x="1304" y="308" text-anchor="middle" class="muted tiny" font-weight="650">AKTIONEN</text>
<path d="M99 322H1341" class="line"/><rect x="99" y="323" width="1242" height="54" fill="#f0f6fd"/><rect x="99" y="323" width="3" height="54" rx="1.5" fill="#4c8ee8"/><text x="116" y="356" font-size="14" font-weight="650">Website-Relaunch</text><text x="392" y="356" font-size="14" class="blueText" font-weight="650">Nordlicht Studio ↗</text><text x="660" y="356" font-size="14">Mia Lehmann</text><rect x="892" y="338" width="82" height="24" rx="12" fill="#eaf5ef"/><text x="933" y="355" text-anchor="middle" font-size="12" fill="#448265">In Arbeit</text><text x="1087" y="356" font-size="14">72 %</text><circle cx="1304" cy="350" r="13" fill="#fff" stroke="#dce5ef"/><text x="1304" y="355" text-anchor="middle" class="muted small">···</text>
<path d="M99 377H1341M99 431H1341M99 485H1341M99 539H1341" class="line"/><text x="116" y="410" font-size="14" font-weight="600">CRM-Migration</text><text x="392" y="410" font-size="14" class="blueText">Bergwerk AG ↗</text><text x="660" y="410" font-size="14">Noah Keller</text><text x="892" y="410" font-size="14">In Arbeit</text><text x="1087" y="410" font-size="14">48 %</text><text x="116" y="464" font-size="14" font-weight="600">Kampagnen-Setup</text><text x="392" y="464" font-size="14" class="blueText">Morgenrot GmbH ↗</text><text x="660" y="464" font-size="14">Lea Baumann</text><text x="892" y="464" font-size="14">Planung</text><text x="1087" y="464" font-size="14">24 %</text><text x="116" y="518" font-size="14" font-weight="600">Kundenportal</text><text x="392" y="518" font-size="14" class="blueText">Komet Digital ↗</text><text x="660" y="518" font-size="14">Mia Lehmann</text><text x="892" y="518" font-size="14">Abgeschlossen</text><text x="1087" y="518" font-size="14">100 %</text>
<text x="116" y="566" class="muted tiny">Ausgewählt: Website-Relaunch · Master-Auswahl aktualisiert die Target-Tabelle.</text><text x="1320" y="566" text-anchor="end" class="muted tiny">4 Datensätze</text>

<!-- Target -->
<rect x="78" y="610" width="1284" height="414" rx="12" class="card" filter="url(#shadow)"/><rect x="99" y="629" width="25" height="22" rx="6" fill="#edf4fd"/><text x="111.5" y="644" text-anchor="middle" class="blueText tiny" font-weight="700">2</text><text x="136" y="645" font-size="16" font-weight="700">Target-Tabelle</text><text x="261" y="645" class="muted small">Beziehungen von <tspan fill="#203453" font-weight="650">Website-Relaunch</tspan></text><rect x="1175" y="624" width="165" height="34" rx="7" fill="#fff" stroke="#dce4ee"/><text x="1257" y="646" text-anchor="middle" class="blueText small" font-weight="650">＋ Verknüpfen</text>
<path d="M99 696H1341" class="line"/><rect x="99" y="665" width="115" height="31" rx="7" fill="#edf4fd"/><text x="156.5" y="685" text-anchor="middle" class="blueText small" font-weight="700">Kunde <tspan font-weight="600">1</tspan></text><text x="237" y="685" class="muted small" font-weight="600">Aufgaben <tspan>3</tspan></text><text x="364" y="685" class="muted small" font-weight="600">Zeiterfassung <tspan>2</tspan></text><text x="1318" y="685" text-anchor="end" class="muted tiny">Nur verknüpfte Einträge</text>
<rect x="99" y="713" width="1242" height="42" rx="4" fill="#f5f7fa"/><text x="116" y="739" class="muted tiny" font-weight="650">KUNDE</text><text x="378" y="739" class="muted tiny" font-weight="650">BRANCHE</text><text x="642" y="739" class="muted tiny" font-weight="650">VERANTWORTLICH</text><text x="866" y="739" class="muted tiny" font-weight="650">STATUS</text><text x="1038" y="739" class="muted tiny" font-weight="650">UMSATZ</text><text x="1230" y="739" class="muted tiny" font-weight="650">AKTIONEN</text>
<path d="M99 755H1341" class="line"/><rect x="99" y="756" width="1242" height="62" fill="#fbfdff"/><text x="116" y="793" font-size="14" font-weight="650">Nordlicht Studio</text><text x="378" y="793" font-size="14">Design &amp; Medien</text><text x="642" y="793" font-size="14">Mia Lehmann</text><rect x="866" y="775" width="69" height="24" rx="12" fill="#eaf5ef"/><text x="900" y="791" text-anchor="middle" font-size="12" fill="#448265">Aktiv</text><text x="1038" y="793" font-size="14" font-weight="650">28.400 €</text><text x="1191" y="793" class="blueText tiny" font-weight="650">Als Master öffnen →</text><text x="1321" y="793" text-anchor="end" class="muted tiny">Bearbeiten · ⋯</text>
<path d="M99 818H1341" class="line"/><text x="116" y="849" class="muted tiny">1 verknüpfter Kunde · Bearbeitung wirkt auf denselben Datensatz in allen Ansichten.</text>
<rect x="99" y="875" width="1242" height="107" rx="9" fill="#f7f9fc" stroke="#edf1f5"/><circle cx="127" cy="909" r="12" fill="#e9f2fd"/><path d="M123 909h8m-3-4 4 4-4 4" fill="none" stroke="#4c83c7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="152" y="913" font-size="13" font-weight="700">Weiter navigieren</text><text x="152" y="941" class="muted small">„Als Master öffnen“ lädt Nordlicht Studio oben und zeigt darunter dessen Projekte, Angebote und Rechnungen.</text><text x="152" y="964" class="blueText tiny" font-weight="600">Zurück über den Datenpfad · keine verschachtelten Tabellen</text>
</svg>
