<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc" fill="#203453">
<title id="title">Master-Detail-Rohdatenansicht auf Mobile</title>
<desc id="desc">Zwei Smartphone-Bildschirme zeigen den Drill-down von der Projektliste zur Target-Ansicht mit Kundenbeziehung und weiterer Navigation.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafd"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c91f1"/><stop offset="1" stop-color="#3474d9"/></linearGradient>
  <filter id="shadow" x="-15%" y="-10%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#18345b" flood-opacity=".12"/></filter>
  <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.muted{fill:#8290a3}.blueText{fill:#3479df}.small{font-size:13px}.tiny{font-size:11px}.line{stroke:#e7ecf2;stroke-width:1}.card{fill:#fff;stroke:#e0e7ef;stroke-width:1.2}</style>
</defs>
<rect width="1000" height="1100" fill="url(#canvas)"/><text x="40" y="48" class="muted small">Acme · Responsive Mockup</text><text x="40" y="82" font-size="24" font-weight="700">Master-Detail auf Mobile</text><text x="960" y="77" text-anchor="end" class="muted small">Auswahl → Target → nächste Ebene</text>

<!-- Step labels -->
<rect x="54" y="101" width="26" height="22" rx="6" fill="#edf4fd"/><text x="67" y="116" text-anchor="middle" class="blueText tiny" font-weight="700">1</text><text x="90" y="117" font-size="13" font-weight="700">Master auswählen</text>
<rect x="549" y="101" width="26" height="22" rx="6" fill="#edf4fd"/><text x="562" y="116" text-anchor="middle" class="blueText tiny" font-weight="700">2</text><text x="585" y="117" font-size="13" font-weight="700">Target ansehen und weiter navigieren</text>

