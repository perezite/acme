<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9f2ff" />
    <meta name="description" content="Klickbarer Klarwerk-Prototyp mit Light und Dark Mode." />
    <title>Klarwerk · Dein Arbeitstag</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try { if (localStorage.getItem('klarwerk-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="m2 8 10-6 10 6-10 6L2 8Z"/><path d="m5 13-3 2 10 6 10-6-3-2"/></symbol>
        <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="m7.5 12 3 3 6-7"/></symbol>
        <symbol id="i-users" viewBox="0 0 24 24"><circle cx="8.5" cy="6.5" r="3.7"/><circle cx="17.7" cy="8.8" r="2.7"/><path d="M1.8 21v-2.6a6.7 6.7 0 0 1 13.4 0V21m1.6-7.4a5.3 5.3 0 0 1 5.4 5.3V21"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="17" rx="2.5"/><path d="M7 2v6m10-6v6M3 11h18m-13 4h.01M12 15h.01M16 15h.01M8 18.5h.01M12 18.5h.01M16 18.5h.01"/></symbol>
        <symbol id="i-contact" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="2.1"/><path d="M5 16.2v-.6a3.5 3.5 0 0 1 7 0v.6H5Zm10-7h3.5M15 13h3.5"/></symbol>
        <symbol id="i-document" viewBox="0 0 24 24"><path d="M14 2H5a1.5 1.5 0 0 0-1.5 1.5v17A1.5 1.5 0 0 0 5 22h14a1.5 1.5 0 0 0 1.5-1.5V8.5L14 2Z"/><path d="M14 2v7h6.5M8 14h8M8 18h8"/></symbol>
        <symbol id="i-team" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.8"/><circle cx="4.7" cy="8" r="2.3"/><circle cx="19.3" cy="8" r="2.3"/><path d="M6.5 21v-3.5a5.5 5.5 0 0 1 11 0V21M1 18v-2a4 4 0 0 1 4-4m18 6v-2a4 4 0 0 0-4-4"/></symbol>
        <symbol id="i-bars" viewBox="0 0 24 24"><rect x="2.5" y="14" width="4" height="8" rx=".6"/><rect x="10" y="8" width="4" height="14" rx=".6"/><rect x="17.5" y="2" width="4" height="20" rx=".6"/></symbol>
        <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="15" cy="5" rx="6" ry="3"/><path d="M9 5v3m12-3v8c0 1.7-2.7 3-6 3m0-5c3.3 0 6-1.3 6-3"/><ellipse cx="8" cy="13" rx="6" ry="3"/><path d="M2 13v6c0 1.7 2.7 3 6 3s6-1.3 6-3v-6M2 16c0 1.7 2.7 3 6 3s6-1.3 6-3"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 5.5v7l5 3"/></symbol>
        <symbol id="i-offer" viewBox="0 0 24 24"><path d="M14 2H5a1.5 1.5 0 0 0-1.5 1.5v17A1.5 1.5 0 0 0 5 22h14a1.5 1.5 0 0 0 1.5-1.5V8.5L14 2Z"/><path d="M14 2v7h6.5m-5.7 4.1a3.5 3.5 0 1 0 0 5.8M8 15h5m-5 2h4"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2c-3.2 2.5-6 3.2-9 3.5V12c0 5 4 8.3 9 10 5-1.7 9-5 9-10V5.5C18 5.2 15.2 4.5 12 2Z"/><path d="m7.5 11.8 3.1 3.2 5.9-6"/></symbol>
        <symbol id="i-package" viewBox="0 0 24 24"><path d="m12 2 10 5v11l-10 5-10-5V7l10-5Z"/><path d="m2 7 10 5 10-5m-10 5v11M7 4.5l10 5"/></symbol>
        <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M8 5H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><path d="M10 4V3a2 2 0 0 1 4 0v1h2v4H8V4h2Zm-3 9h10M7 17h10"/></symbol>
        <symbol id="i-cart" viewBox="0 0 24 24"><path d="M1 3h3l3 13h12l3-10H5"/><circle cx="8" cy="21" r="1.5"/><circle cx="18" cy="21" r="1.5"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 2-.6 3-2 .9-2.5-1.5-2.1 3.7L4.6 10v2l-2.3 1.9 2.1 3.7L7 16.2l2 .9.6 3h4.2l.6-3 2-.9 2.5 1.4 2.1-3.7-2.3-1.9v-2l2.3-1.9-2.1-3.7L16.3 6l-2-.9-.6-3H9.5Z"/><circle cx="11.6" cy="11.6" r="3.4"/></symbol>
        <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="1.5"/><path d="m3 5 9 7 9-7"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C8 2 4 2 1.5 3v18C5 20 8 20.5 12 23c4-2.5 7-3 10.5-2V3C20 2 16 2 12 5Zm0 0v18"/></symbol>
        <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="15" rx="2"/><path d="M8 6V3h8v3M7 6v15M17 6v15"/></symbol>
        <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 13V9a8 8 0 0 1 16 0v4m0 5v1c0 2-2 3-5 3h-2"/><rect x="2" y="11" width="4" height="8" rx="2"/><rect x="18" y="11" width="4" height="8" rx="2"/><path d="M12 21h3v2h-3z"/></symbol>
        <symbol id="i-zap" viewBox="0 0 24 24"><path d="m13 1-11 13h8l-1 9L22 9h-9l1-8Z"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.8 15A9.5 9.5 0 0 1 9 3.2 9.5 9.5 0 1 0 20.8 15Z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 6 6"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 10h18c0-2-3-3-3-10M10 22h4M12 1v1"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      </defs>
    </svg>

    <div class="stage-frame" id="stage-frame">
      <div class="stage" id="stage">
        <header class="site-header">
          <div class="brand-group">
            <button class="brand" id="home-button" aria-label="Klarwerk · Zur Startseite">
              <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
              <span>Klarwerk</span>
            </button>
            <span class="header-divider brand-divider" aria-hidden="true"></span>
            <button class="icon-button theme-button" id="theme-button" aria-label="Dark Mode aktivieren" title="Dark Mode aktivieren" aria-pressed="false"><svg aria-hidden="true"><use href="#i-moon"></use></svg></button>
          </div>

          <form class="global-search" id="search-form" role="search">
            <svg aria-hidden="true"><use href="#i-search"></use></svg>
            <input type="search" id="tile-search" aria-label="Arbeitsbereiche suchen" placeholder="Suchen …" autocomplete="off" spellcheck="false" />
          </form>

          <div class="header-actions">
            <button class="icon-button notification-button" id="notifications-button" aria-label="Benachrichtigungen anzeigen" aria-controls="notifications-panel" aria-expanded="false"><svg aria-hidden="true"><use href="#i-bell"></use></svg><span class="notification-dot" id="notification-dot" aria-hidden="true"></span></button>
            <span class="header-divider profile-divider" aria-hidden="true"></span>
            <button class="profile-button" id="profile-button" aria-label="Profil von Alex anzeigen" aria-controls="profile-panel" aria-expanded="false"><img class="avatar" src="./assets/profile-alex.png" alt="" width="50" height="50" decoding="async" /><svg aria-hidden="true"><use href="#i-chevron"></use></svg></button>
          </div>
        </header>

        <main>
          <div class="welcome">
            <h1>Guten Morgen, Alex</h1>
            <p>Alles für deinen Arbeitstag.</p>
          </div>
          <nav class="tile-layout" id="tile-layout" aria-label="Deine Arbeitsbereiche"></nav>
          <p class="empty-search" id="empty-search" hidden>Keine passenden Arbeitsbereiche gefunden.</p>
        </main>

        <section class="header-panel notifications-panel" id="notifications-panel" aria-labelledby="notifications-heading" hidden>
          <h2 id="notifications-heading">Benachrichtigungen</h2>
          <p>Du bist auf dem neuesten Stand.</p>
          <span class="panel-note">Hier erscheinen deine neuen Mitteilungen.</span>
        </section>
        <section class="header-panel profile-panel" id="profile-panel" aria-labelledby="profile-heading" hidden>
          <div class="profile-summary"><img class="avatar" src="./assets/profile-alex.png" alt="" width="50" height="50" decoding="async" /><div><h2 id="profile-heading">Alex</h2><p>Dein persönlicher Arbeitsbereich</p></div></div>
          <button class="panel-action" id="profile-theme-button"><svg aria-hidden="true"><use href="#i-moon"></use></svg><span>Zum Dark Mode wechseln</span></button>
        </section>
      </div>
    </div>

    <div class="toast-root" id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
    <p class="sr-only" id="search-status" role="status" aria-live="polite"></p>
    <noscript><p class="noscript-message">Bitte aktiviere JavaScript, um den klickbaren Prototypen zu verwenden.</p></noscript>
  </body>
</html>
